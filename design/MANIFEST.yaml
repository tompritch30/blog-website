# Origin and licence of every design asset on the site. One entry per asset; an asset that leaves
# the repo leaves this file in the same commit. Why each is used: design/SYSTEM.md.

fonts:
  # Every font the built site loads. The three page faces are fetched by next/font/google at build
  # time and self-hosted with the site (src/app/layout.tsx); the browser makes no request to Google.
  - name: Newsreader
    use: headings, the name and case-study figures
    files: next/font/google (Newsreader), CSS variable --font-newsreader
    upstream: https://github.com/productiontype/Newsreader
    licence: SIL Open Font License 1.1
    weights: variable (wght 200 to 800), with the opsz axis (6 to 72) requested
    styles: normal, italic
    subsets: latin
    display: swap
  - name: IBM Plex Sans
    use: reading text, navigation, meta lines
    files: next/font/google (IBM_Plex_Sans), CSS variable --font-plex-sans
    upstream: https://github.com/IBM/plex
    licence: SIL Open Font License 1.1
    weights: 400, 500, 600
    styles: normal, italic
    subsets: latin
    display: swap
  - name: IBM Plex Mono
    use: code in posts
    files: next/font/google (IBM_Plex_Mono), CSS variable --font-plex-mono
    upstream: https://github.com/IBM/plex
    licence: SIL Open Font License 1.1
    weights: 400, 500
    styles: normal
    subsets: latin
    display: swap
  - name: Geist
    use: the favicon and the share cards (src/app/icon.tsx, src/lib/og.tsx), which pass no font to next/og, so it falls back to the one it bundles; drawn into PNGs at build time, never sent to the browser as a font
    files: node_modules/next/dist/compiled/@vercel/og/Geist-Regular.ttf (bundled with next 16.3.8, @vercel/og 0.11.1)
    upstream: https://github.com/vercel/geist-font
    licence: SIL Open Font License 1.1
    weights: 400 (the only file bundled)
    styles: normal
    subsets: latin, as bundled
    note: open item in design/SYSTEM.md (Learnings), to set the cards in Newsreader

images:
  - name: portrait
    path: public/me/headshot.jpg (src/content/profile.ts, portrait; rendered with next/image, which serves AVIF or WebP)
    kind: 800 x 800 JPEG (mozjpeg, quality 80), no EXIF, ICC, XMP or IPTC metadata; sha256 b5d4631e78f2ae2ecbc921b68a9d658ee9c1b654de4c76d490d09770aa4c864b
    origin: owner-supplied photo, 4 Oct 2026 (a 1254 x 1254 PNG he provided), resized and re-encoded without metadata; replaces the GitHub avatar used on 3 Oct
    licence: his own photo, used on his own site at his request
  - name: Palindrome logo
    path: public/logos/palindrome.svg (inlined by src/components/home/OrgMark.tsx beside the Palindrome role on /; also invader type 1, below)
    kind: monochrome SVG, fill currentColor, 215 x 26; sha256 007da003b4959e1fb8ff28a5a8c93558899ff31a60e2d7a673a3f15f71d073bc; inlined with only its XML prolog, editor comment and layer id dropped, shape untouched
    origin: Palindrome's own logo, from https://cdn.prod.website-files.com/6820781f3dc65fa89a62baf1/6947facd0f5989009c2de55c_Logo_Palindrome_BW.svg (made monochrome by the lead, 3 Oct 2026)
    terms: https://www.palindrome.co/terms.html
    licence: used with the owner's employer's permission pending, listed for confirmation
  - name: ForestVO trajectory plot
    path: public/paper/forestvo-trajectory.png (src/content/profile.ts, paperFigure; shown in About on /)
    kind: 1253 x 480 PNG, RGBA, no metadata; sha256 25ca114f6df83ab8a410fcecadda300f500e921c7cadeac6c7e87afd6f0a8fe5; shown on a light plate
    origin: 'one figure from his own paper, Pritchard et al., "ForestVO: Enhancing Visual Odometry in Forest Environments through ForestGlue", IEEE Robotics and Automation Letters 2025 (https://doi.org/10.1109/lra.2025.3557738), taken from the accepted version on arXiv, https://arxiv.org/abs/2504.01261'
    licence: © 2025 IEEE, reused under IEEE's author reuse terms, which let an author reuse a figure from their own paper with a full credit line
    credit: "© 2025 IEEE. From Pritchard et al., ForestVO, IEEE RA-L 2025."
    credit_shown: beside the plot, as its caption (src/content/profile.ts, paperFigure.credit)
  - name: organisation wordmarks
    path: src/components/home/OrgMark.tsx (names from src/content/profile.ts, organisations)
    kind: text in the heading face, no image
    origin: Fletchers, Stark, Imperial and IEEE RA-L set as plain words, because their logos' terms forbid reuse without consent
    licence: not applicable (no logo used)

generated:
  - name: favicon
    path: src/app/icon.tsx
    kind: 32 x 32 PNG drawn by next/og at build time, the initials in paper on ink, 4px radius
    origin: written for this site
    licence: the repo's own LICENSE
  - name: share cards
    path: src/app/opengraph-image.tsx, src/app/writing/[slug]/opengraph-image.tsx, src/lib/og.tsx
    kind: 1200 x 630 PNGs drawn by next/og at build time, a heading and a line in the light theme's colours
    origin: written for this site
    licence: the repo's own LICENSE

easter_egg:
  decision: docs/adr/0004-easter-egg-prior-art.md
  code:
    - path: src/lib/invaders/engine.ts
      origin: written for this site, 3 Oct 2026
      licence: the repo's own LICENSE
      note: no code copied from any candidate in ADR 0004; the rules (three invader types, a heartbeat that quickens as they die, edge drop and reverse, eroding shields, a mystery ship) follow the arcade game's conventions, not its code
    - path: src/lib/invaders/links.ts
      origin: written for this site, 3 Oct 2026
      licence: the repo's own LICENSE
    - path: src/lib/invaders/trigger.ts
      origin: written for this site, 3 Oct 2026
      licence: the repo's own LICENSE
    - path: src/components/invaders/Game.tsx
      origin: written for this site, 3 Oct 2026
      licence: the repo's own LICENSE
    - path: src/components/invaders/AlienTrigger.tsx
      origin: written for this site, 3 Oct 2026
      licence: the repo's own LICENSE
    - path: src/components/arcade/games.ts
      origin: written for this site, 3 Oct 2026
      licence: the repo's own LICENSE
  art:
    - name: alien trigger
      path: src/components/invaders/alien.ts (drawn by AlienTrigger.tsx)
      kind: 11 x 8 pixel grid in code, two poses, drawn as inline SVG in currentColor
      origin: original, drawn by the builder 3 Oct 2026; a round head with a bent antenna and four short legs, not based on any arcade sprite
      licence: the repo's own LICENSE
    - name: player ship
      path: src/components/invaders/sprites.ts (SHIP)
      kind: 13 x 8 pixel grid in code, drawn on canvas in the page's text colour
      origin: original, drawn by the builder 3 Oct 2026; a winged dart, not the arcade laser base
      licence: the repo's own LICENSE
    - name: invader type 3 (top row), the beetle
      path: src/components/invaders/sprites.ts (CREATURES[3])
      kind: 13 x 11 pixel grid in code, two frames
      origin: original, drawn by the builder 3 Oct 2026; a shelled beetle with antennae, not the arcade squid; its shell carries "VO" (the ForestVO paper) in the builder's own 3 x 5 pixel letters, which is typography, not any logo
      licence: the repo's own LICENSE
    - name: invader type 2 (middle rows), the drifter
      path: src/components/invaders/sprites.ts (CREATURES[2])
      kind: 13 x 11 pixel grid in code, two frames
      origin: original, drawn by the builder 3 Oct 2026; a domed drifter with one antenna and a fringed skirt, not the arcade crab; it carries "IC" (Imperial College) in the same pixel letters, typography only, not Imperial's logo
      licence: the repo's own LICENSE
    - name: invader type 1 (bottom rows), the Palindrome mark
      path: public/logos/palindrome.svg
      kind: monochrome SVG (fill currentColor), copied byte for byte (sha256 007da003b4959e1fb8ff28a5a8c93558899ff31a60e2d7a673a3f15f71d073bc); the game crops the view to the 26 x 26 mark and sets the ink colour in memory only
      origin: Palindrome's own logo, from https://cdn.prod.website-files.com/6820781f3dc65fa89a62baf1/6947facd0f5989009c2de55c_Logo_Palindrome_BW.svg (made monochrome by the lead, 3 Oct 2026)
      terms: https://www.palindrome.co/terms.html
      licence: used with the owner's employer's permission pending, listed for confirmation
    - name: shield
      path: src/components/invaders/sprites.ts (SHIELD)
      kind: 20 x 12 pixel grid in code, eroded cell by cell in play
      origin: original, drawn by the builder 3 Oct 2026; a stepped dome with a doorway
      licence: the repo's own LICENSE
    - name: mystery ship
      path: src/components/invaders/sprites.ts (MYSTERY)
      kind: 18 x 7 pixel grid in code, drawn in gold (#9a6f00, 4.09:1 on the paper) with one soft shadow, an 8px blur in the same gold and the only glow on the site (none when motion is reduced)
      origin: original, drawn by the builder 3 Oct 2026; a golden airship with tail fins and a gondola, not the arcade saucer
      licence: the repo's own LICENSE
  not_used:
    - Fletchers, Stark and Imperial logos: their terms forbid reuse without consent (lead's check, 3 Oct 2026); none is used or redrawn
  sound: none
