# Origin and licence of every design asset on the site. One entry per asset.
# Fonts are added by the design-system slice.

fonts:
  # The kb variant (branch site-v2-kb). All three are fetched by next/font/google at build time and
  # self-hosted with the site; the browser makes no request to Google.
  - name: Newsreader
    use: headings, the name, case-study figures and the one italic line
    source: Google Fonts via next/font/google (variable, wght and opsz axes)
    licence: SIL Open Font License 1.1
  - name: IBM Plex Sans
    use: reading text, navigation, meta lines
    source: Google Fonts via next/font/google (400, 500, 600; normal and italic)
    licence: SIL Open Font License 1.1
  - name: IBM Plex Mono
    use: code in posts
    source: Google Fonts via next/font/google (400, 500)
    licence: SIL Open Font License 1.1

easter_egg:
  decision: docs/adr/0004-easter-egg-prior-art.md
  code:
    - path: src/lib/invaders/engine.ts
      origin: written for this site, 3 Oct 2026
      licence: the repo's own LICENSE
      note: no code copied from any candidate in ADR 0004; the rules (three invader types, a heartbeat that quickens as they die, edge drop and reverse, eroding shields, a mystery ship) follow the arcade game's conventions, not its code
    - path: src/lib/invaders/links.ts
      origin: written for this site, 3 Oct 2026
      licence: the repo's own LICENSE
    - path: src/lib/invaders/trigger.ts
      origin: written for this site, 3 Oct 2026
      licence: the repo's own LICENSE
    - path: src/components/invaders/Game.tsx
      origin: written for this site, 3 Oct 2026
      licence: the repo's own LICENSE
  art:
    - name: alien trigger
      path: src/components/invaders/alien.ts (drawn by AlienTrigger.tsx)
      kind: 11 x 8 pixel grid in code, two poses, drawn as inline SVG in currentColor
      origin: original, drawn by the builder 3 Oct 2026; a round head with a bent antenna and four short legs, not based on any arcade sprite
      licence: the repo's own LICENSE
    - name: player ship
      path: src/components/invaders/sprites.ts (SHIP)
      kind: 13 x 8 pixel grid in code, drawn on canvas in the page's text colour
      origin: original, drawn by the builder 3 Oct 2026; a winged dart, not the arcade laser base
      licence: the repo's own LICENSE
    - name: invader type 3 (top row), the beetle
      path: src/components/invaders/sprites.ts (CREATURES[3])
      kind: 13 x 11 pixel grid in code, two frames
      origin: original, drawn by the builder 3 Oct 2026; a shelled beetle with antennae, not the arcade squid; its shell carries "VO" (the ForestVO paper) in the builder's own 3 x 5 pixel letters, which is typography, not any logo
      licence: the repo's own LICENSE
    - name: invader type 2 (middle rows), the drifter
      path: src/components/invaders/sprites.ts (CREATURES[2])
      kind: 13 x 11 pixel grid in code, two frames
      origin: original, drawn by the builder 3 Oct 2026; a domed drifter with one antenna and a fringed skirt, not the arcade crab; it carries "IC" (Imperial College) in the same pixel letters, typography only, not Imperial's logo
      licence: the repo's own LICENSE
    - name: invader type 1 (bottom rows), the Palindrome mark
      path: public/logos/palindrome.svg
      kind: monochrome SVG (fill currentColor), copied byte for byte (sha256 007da003b4959e1fb8ff28a5a8c93558899ff31a60e2d7a673a3f15f71d073bc); the game crops the view to the 26 x 26 mark and sets the ink colour in memory only
      origin: Palindrome's own logo, from https://cdn.prod.website-files.com/6820781f3dc65fa89a62baf1/6947facd0f5989009c2de55c_Logo_Palindrome_BW.svg (made monochrome by the lead, 3 Oct 2026)
      terms: https://www.palindrome.co/terms.html
      licence: used with the owner's employer's permission pending, listed for confirmation
    - name: shield
      path: src/components/invaders/sprites.ts (SHIELD)
      kind: 20 x 12 pixel grid in code, eroded cell by cell in play
      origin: original, drawn by the builder 3 Oct 2026; a stepped dome with a doorway
      licence: the repo's own LICENSE
    - name: mystery ship
      path: src/components/invaders/sprites.ts (MYSTERY)
      kind: 18 x 7 pixel grid in code, drawn in gold with one soft shadow (none when motion is reduced)
      origin: original, drawn by the builder 3 Oct 2026; a golden airship with tail fins and a gondola, not the arcade saucer
      licence: the repo's own LICENSE
  not_used:
    - Fletchers, Stark and Imperial logos: their terms forbid reuse without consent (lead's check, 3 Oct 2026); none is used or redrawn
  sound: none
